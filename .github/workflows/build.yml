name: Build and Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 send2trash pytest
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libgl1 libegl1 libxkbcommon-x11-0
      - name: Testleri Calistir
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 send2trash pytest pyinstaller Pillow
      - name: Testleri Calistir
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen
      - name: ICO Olustur
        run: python generate_robot_png.py --make-ico
      - name: EXE Olustur (onedir)
        run: >
          pyinstaller
          --noconfirm
          --onedir
          --windowed
          --name "MasaustuRobotSupurge"
          --icon "assets/robot_supurge.ico"
          --add-data "assets;assets"
          main.py
      - name: Setup.exe Olustur (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /O+
      - name: Setup Dosyasini Sun
        uses: actions/upload-artifact@v4
        with:
          name: MasaustuRobotSupurge-Setup
          path: Output/MasaustuRobotSupurge_Setup.exe
